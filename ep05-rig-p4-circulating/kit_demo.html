<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Kit Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=block" rel="stylesheet">
<style>
  :root { --bg: #05070d; --fg: #e2e8f0; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px Kanit, system-ui, sans-serif; }
  #ui { position: fixed; top: 8px; left: 8px; z-index: 2; display: flex; gap: 8px; align-items: center; background: rgba(0,0,0,0.6); padding: 6px 10px; border-radius: 8px; }
  canvas { display: block; height: 100vh; width: auto; max-width: 100vw; margin: 0 auto; }
</style>
</head>
<body>
<div id="ui"><select id="scene"></select><input id="time" type="range" min="0" max="12" step="0.02" value="2"><span id="tv"></span><label><input id="guides" type="checkbox" checked> guides</label></div>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// Demo harness for overlay_kit.js. window.render(scene, t, guides) draws one still; window.SCENES lists scenes + sample times.
import * as K from './overlay_kit.js';
const { SYS, C } = K;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const avatar = new Image(); avatar.src = 'assets/avatar.png';
const CIRC = SYS.circ;

// ---------- backdrop: neutral dusk gradient with a faint rig silhouette (stand-in for the 3D render)
function backdrop() {
  const g = ctx.createLinearGradient(0, 0, 0, 1920);
  g.addColorStop(0, '#0a1330'); g.addColorStop(0.45, '#1b2b55'); g.addColorStop(0.72, '#3b3a66'); g.addColorStop(1, '#151a33');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1920);
  const h = ctx.createRadialGradient(540, 1250, 40, 540, 1250, 900); h.addColorStop(0, 'rgba(255,170,110,0.28)'); h.addColorStop(1, 'rgba(255,170,110,0)');
  ctx.fillStyle = h; ctx.fillRect(0, 0, 1080, 1920);
  const tl = ctx.createRadialGradient(180, 200, 20, 180, 200, 700); tl.addColorStop(0, 'rgba(20,184,166,0.16)'); tl.addColorStop(1, 'rgba(20,184,166,0)');
  ctx.fillStyle = tl; ctx.fillRect(0, 0, 1080, 1920);
  // derrick silhouette
  ctx.save(); ctx.strokeStyle = 'rgba(160,180,220,0.20)'; ctx.lineWidth = 6;
  const L = [[430, 1300], [500, 260]], R = [[650, 1300], [580, 260]];
  ctx.beginPath(); ctx.moveTo(...L[0]); ctx.lineTo(...L[1]); ctx.lineTo(...R[1]); ctx.lineTo(...R[0]); ctx.stroke();
  ctx.lineWidth = 3;
  for (let i = 0; i < 12; i++) { const u = i / 12, v = (i + 1) / 12; const xl = (a) => 430 + 70 * a, xr = (a) => 650 - 70 * a, y = (a) => 1300 - 1040 * a;
    ctx.beginPath(); ctx.moveTo(xl(u), y(u)); ctx.lineTo(xr(v), y(v)); ctx.moveTo(xr(u), y(u)); ctx.lineTo(xl(v), y(v)); ctx.stroke(); }
  ctx.fillStyle = 'rgba(30,40,70,0.9)'; ctx.fillRect(250, 1300, 580, 40); ctx.fillRect(0, 1340, 1080, 580);
  ctx.restore();
}
function guides() {
  ctx.save();
  ctx.setLineDash([10, 10]); ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 2; ctx.strokeRect(60, 160, 900, 1120); ctx.setLineDash([]);
  // mock caption card (frame.html draws the real one at y ~1310-1560)
  ctx.fillStyle = 'rgba(12,18,34,0.78)'; K.rr(ctx, 110, 1360, 860, 150, 28); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.font = '600 44px Kanit'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('คำบรรยาย (caption card)', 540, 1418);
  ctx.font = '400 26px Kanit'; ctx.fillText('frame.html · y 1310–1560', 540, 1470);
  ctx.fillStyle = 'rgba(255,40,80,0.10)'; ctx.fillRect(0, 1600, 1080, 320);
  ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.font = '600 26px Kanit'; ctx.fillText('PLATFORM UI · y > 1600', 540, 1660);
  ctx.restore();
}

const FLOW = [
  { label: 'Mud Tank', th: 'บ่อพัก Mud (Active Pit)' }, { label: 'Mud Pump', th: 'ปั๊มแรงดันสูง' }, { label: 'Standpipe', th: 'ท่อตั้งข้างเสา Derrick' },
  { label: 'Rotary Hose', th: 'ท่ออ่อนแรงดันสูง' }, { label: 'Top Drive', th: 'Gooseneck · Washpipe' }, { label: 'Drill String', th: 'ไหลลงในท่อเจาะ' },
  { label: 'Bit', th: 'พุ่งออกจาก Nozzle' }, { label: 'Annulus', th: 'พาเศษหินกลับขึ้นมา' }, { label: 'Flowline', th: 'ท่อไหลกลับ' }, { label: 'Shakers', th: 'แยกเศษหินออก' },
];
const STAGES = [
  { name: 'Shale Shaker', th: 'ตะแกรงสั่น · API 200', cut: 75, prefix: '> ', unit: 'µm' },
  { name: 'Desander', th: 'Hydrocyclone 10 นิ้ว', cut: '40–50', prefix: '~', unit: 'µm' },
  { name: 'Desilter', th: 'Hydrocyclone 4 นิ้ว', cut: '15–25', prefix: '~', unit: 'µm' },
  { name: 'Centrifuge', th: 'เหวี่ยงแยกด้วยแรง G', cut: '2–7', prefix: '~', unit: 'µm' },
];
const pwl = (pts, t) => { if (t <= pts[0][0]) return pts[0][1]; for (let i = 0; i < pts.length - 1; i++) if (t < pts[i + 1][0]) return K.lerp(pts[i][1], pts[i + 1][1], K.sstep(pts[i][0], pts[i + 1][0], t)); return pts[pts.length - 1][1]; };

// scene name -> { times, draw(t) }
const SCENES = {
  titleCard: { times: [0.55, 1.0, 1.5, 2.9, 5.0, 6.7], draw: t => K.titleCard(ctx, t, { t0: 0.3, t1: 6.8, part: 4, title: 'Circulating System', subtitle: 'ระบบหมุนเวียน Mud ลงหลุมแล้วกลับขึ้นมา', hook: 'Mud ไหลวนในหลุมได้ยังไง?', color: CIRC }) },
  sectionHeader: { times: [0.15, 0.35, 0.7, 3.0, 5.85], draw: t => {
    K.sectionHeader(ctx, t, { t0: 0, t1: 6, index: 'P4', label: 'Circulating System', sub: 'Mud Pumps', color: CIRC });
    K.sectionHeader(ctx, t, { t0: 0.2, t1: 6, index: '07', label: 'ระบบควบคุมของแข็ง (Solids Control) ที่ทำงานต่อเนื่องตลอดเวลา', sub: 'หัวข้อยาวมากเพื่อทดสอบการย่อ', color: SYS.power, y: 260 });
  } },
  factCard: { times: [0.25, 0.6, 1.2, 2.5, 5.9], draw: t => {
    K.factCard(ctx, t, { t0: 0, t1: 6, kicker: 'MUD PUMP', title: 'Triplex Mud Pump', lines: ['ลูกสูบ 3 ตัว อัด Mud แรงดันสูง', 'แรงดันใช้งานได้ถึง ~5,000 psi', 'ทำงานคู่กัน 2–3 ตัวบนแท่นเจาะ'], big: { value: 1600, unit: 'hp', label: 'กำลังต่อเครื่อง (ทั่วไป)' }, iconName: 'pump', color: CIRC, bottom: 1270 });
    K.factCard(ctx, t, { t0: 0.4, t1: 6, title: 'Mud ทำหน้าที่อะไร?', lines: ['พาเศษหินขึ้นมา', 'กดแรงดันในหลุม · หล่อเย็น Bit'], theme: 'dark', iconName: 'drop', color: CIRC, bottom: 760 });
  } },
  callout: { times: [0.1, 0.3, 0.55, 2.0, 5.8], draw: t => {
    const pts = [[700, 720], [380, 960], [540, 520]];
    ctx.save(); ctx.fillStyle = 'rgba(200,146,90,0.85)'; for (const [x, y] of pts) { ctx.beginPath(); ctx.arc(x, y, 34, 0, 7); ctx.fill(); } ctx.restore();
    K.callout(ctx, t, { t0: 0, t1: 6, ax: 700, ay: 720, x: 300, y: 600, label: 'Mud Pump', sub: 'ปั๊มแรงดันสูง', color: CIRC });
    K.callout(ctx, t, { t0: 0.3, t1: 6, ax: 380, ay: 960, x: 940, y: 1100, label: 'Pulsation Dampener', sub: 'ลดแรงกระชาก', color: SYS.power, align: 'right' });
    K.callout(ctx, t, { t0: 0.6, t1: 6, ax: 540, ay: 520, x: 520, y: 330, label: 'Standpipe', sub: '', color: CIRC });
  } },
  flowPathMap: { times: [0.3, 0.8, 1.6, 3.0, 4.5, 7.0], draw: t => K.flowPathMap(ctx, t, { t0: 0, t1: 8, nodes: FLOW, current: pwl([[0, 0], [2.0, 0], [2.6, 1], [3.6, 1], [4.2, 4], [5.5, 4], [6.2, 7], [8, 7]], t), color: CIRC }) },
  stepList: { times: [0.2, 0.6, 1.5, 3.0, 4.4, 5.9], draw: t => K.stepList(ctx, t, { t0: 0, t1: 6, title: 'SOLIDS CONTROL', items: [{ label: 'Shale Shaker', sub: 'ตะแกรงสั่น' }, { label: 'Degasser', sub: 'แยกแก๊ส' }, { label: 'Desander', sub: 'แยกทราย' }, { label: 'Desilter', sub: 'แยกตะกอนละเอียด' }, { label: 'Centrifuge', sub: 'เหวี่ยงแยก' }], current: pwl([[0, 0], [2, 0], [2.5, 2], [3.5, 2], [4.0, 3]], t), color: CIRC, x: 60, y: 420, w: 340 }) },
  sizeFunnel: { times: [0.3, 1.0, 1.8, 3.2, 4.6, 6.0], draw: t => K.sizeFunnel(ctx, t, { t0: 0, t1: 8, stages: STAGES, active: t > 4 ? 1 : -1, color: CIRC }) },
  formulaCard: { times: [0.3, 1.0, 1.9, 2.8, 4.2, 6.0], draw: t => K.formulaCard(ctx, t, { t0: 0, t1: 8, kicker: 'PUMP OUTPUT · TRIPLEX', title: 'ปั๊มส่ง Mud ได้กี่บาร์เรลต่อสโตรก?', color: CIRC,
    lines: [{ label: 'สูตร', text: 'Output = [[0.000243]] × D² × L' }, { label: 'แทนค่า', text: 'D = 6 in (Liner) · L = 12 in (Stroke)' }, { label: 'คำนวณ', text: '= 0.000243 × 36 × 12 = [[0.105 bbl/stk]]' }],
    result: { label: '0.105 bbl × 42 gal/bbl', value: 4.41, unit: 'gal / stroke' } }) },
  gaugeDial: { times: [0.2, 0.6, 1.2, 2.5, 5.9], draw: t => {
    K.gaugeDial(ctx, t, { t0: 0, t1: 6, cx: 200, cy: 640, r: 112, value: 120 + 4 * Math.sin(t * 2), max: 200, unit: 'SPM', label: 'Pump Rate', sub: 'สโตรก/นาที', color: CIRC });
    K.gaugeDial(ctx, t, { t0: 0, t1: 6, delay: 0.15, cx: 510, cy: 640, r: 112, value: 3200 + 60 * Math.sin(t * 3), max: 5000, unit: 'psi', label: 'SPP', sub: 'แรงดัน Standpipe', color: SYS.power, zones: [{ from: 4500, to: 5000, color: '#ef4444' }] });
    K.gaugeDial(ctx, t, { t0: 0, t1: 6, delay: 0.3, cx: 820, cy: 640, r: 112, value: 529, max: 800, unit: 'gpm', label: 'Flow Rate', sub: 'อัตราการไหล', color: SYS.hoist });
    K.gaugeDial(ctx, t, { t0: 0, t1: 6, delay: 0.2, cx: 510, cy: 1060, r: 100, value: 10.4, max: 18, min: 8, decimals: 1, unit: 'ppg', label: 'Mud Weight', sub: 'น้ำหนัก Mud', color: CIRC });
  } },
  recapGrid: { times: [0.4, 1.2, 2.2, 3.5, 7.8], draw: t => K.recapGrid(ctx, t, { t0: 0, t1: 8, kicker: 'สรุป PART 4', title: 'Circulating System', color: CIRC,
    items: ['Mud Tank · Pits', 'Mud Pump (Triplex)', 'Standpipe Manifold', 'Rotary Hose · Gooseneck', 'Drill String → Bit', 'Annulus → Flowline', 'Shale Shakers', 'Degasser', 'Desander · Desilter', 'Centrifuge'] }) },
  recapGridSub: { times: [3.0], draw: t => K.recapGrid(ctx, t, { t0: 0, t1: 8, kicker: 'สรุป', title: 'Solids Control', color: CIRC, items: STAGES.map(s => ({ label: s.name, sub: s.th })) }) },
  ctaFollow: { times: [0.3, 1.0, 2.0, 2.6, 3.05, 3.4, 3.9, 4.6, 7.0], draw: t => K.ctaFollow(ctx, t, { t0: 0, t1: 8, avatar, clickAt: 3.0 }) },
  nextTeaser: { times: [0.3, 0.7, 1.3, 3.0], draw: t => K.nextTeaser(ctx, t, { t0: 0, part: 5, title: 'Well Control', sub: 'BOP ปิดหลุมกัน Kick ได้ยังไง?', color: SYS.wc }) },
  wipeDiag: { times: [0.2, 0.35, 0.5, 0.65, 0.8], draw: t => { demoBg(t < 0.5 ? 'A' : 'B'); K.wipe(ctx, t, { tc: 0.5, dur: 0.7, type: 'diag', accent: CIRC }); } },
  wipeBars: { times: [0.25, 0.4, 0.5, 0.6, 0.75], draw: t => { demoBg(t < 0.5 ? 'A' : 'B'); K.wipe(ctx, t, { tc: 0.5, dur: 0.7, type: 'bars', accent: CIRC }); } },
  wipeIris: { times: [0.3, 0.45, 0.6, 0.75], draw: t => { demoBg(t < 0.5 ? 'A' : 'B'); K.wipe(ctx, t, { tc: 0.5, dur: 0.7, type: 'iris', accent: CIRC, cy: 800 }); } },
  wipeSlide: { times: [0.3, 0.45, 0.6, 0.75], draw: t => { demoBg(t < 0.5 ? 'A' : 'B'); K.wipe(ctx, t, { tc: 0.5, dur: 0.7, type: 'slide', accent: CIRC }); } },
  composite: { times: [2.5], draw: t => {
    K.sectionHeader(ctx, t, { t0: 0, t1: 9, index: 'P4', label: 'Mud Pumps', sub: 'ปั๊มโคลน', color: CIRC });
    ctx.save(); ctx.fillStyle = 'rgba(200,146,90,0.85)'; ctx.beginPath(); ctx.arc(640, 760, 30, 0, 7); ctx.fill(); ctx.restore();
    K.callout(ctx, t, { t0: 0.4, t1: 9, ax: 640, ay: 760, x: 300, y: 620, label: 'Fluid End', sub: 'ลูกสูบ + วาล์ว', color: CIRC });
    K.factCard(ctx, t, { t0: 0.6, t1: 9, kicker: 'MUD PUMP', title: 'Triplex Pump', lines: ['ลูกสูบ 3 ตัว ดันต่อเนื่อง', 'ส่ง Mud ลงหลุมแรงดันสูง'], big: { value: 4.41, unit: 'gal/stk', label: 'Liner 6" · Stroke 12"' }, iconName: 'pump', color: CIRC });
  } },
};
function demoBg(which) {
  if (which === 'B') { ctx.save(); ctx.fillStyle = 'rgba(20,184,166,0.18)'; ctx.fillRect(0, 0, 1080, 1920); ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.font = '600 120px Kanit'; ctx.textAlign = 'center'; ctx.fillText('SCENE B', 540, 900); ctx.restore(); }
  else { ctx.save(); ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.font = '600 120px Kanit'; ctx.textAlign = 'center'; ctx.fillText('SCENE A', 540, 900); ctx.restore(); }
}

window.SCENES = Object.fromEntries(Object.entries(SCENES).map(([k, v]) => [k, v.times]));
window.render = (name, t, g = true) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.clearRect(0, 0, 1080, 1920);
  backdrop(); if (g) guides();
  SCENES[name].draw(t);
  return cv.toDataURL('image/png');
};
// contact sheet: all times of a scene side by side at 1/3 scale
window.sheet = (name, g = true) => {
  const times = SCENES[name].times, s = 1 / 3, sw = 1080 * s, sh = 1920 * s, pad = 12;
  const out = document.createElement('canvas'); out.width = times.length * (sw + pad) + pad; out.height = sh + 56;
  const o = out.getContext('2d'); o.fillStyle = '#05070d'; o.fillRect(0, 0, out.width, out.height);
  times.forEach((t, i) => {
    window.render(name, t, g); o.drawImage(cv, pad + i * (sw + pad), 44, sw, sh);
    o.fillStyle = '#cbd5e1'; o.font = '600 20px Kanit'; o.textBaseline = 'middle'; o.fillText(`${name}  t=${t.toFixed(2)}s`, pad + i * (sw + pad), 22);
  });
  return out.toDataURL('image/png');
};

// interactive preview
const sel = document.getElementById('scene'), rng = document.getElementById('time'), tv = document.getElementById('tv'), gd = document.getElementById('guides');
for (const k of Object.keys(SCENES)) sel.add(new Option(k, k));
const redraw = () => { tv.textContent = (+rng.value).toFixed(2) + 's'; window.render(sel.value, +rng.value, gd.checked); };
sel.onchange = rng.oninput = gd.onchange = redraw;
Promise.all([document.fonts.load('400 32px Kanit', 'กขค abc'), document.fonts.load('600 32px Kanit', 'กขค abc'), document.fonts.ready,
  new Promise(r => { if (avatar.complete) r(); else { avatar.onload = r; avatar.onerror = r; } })])
  .then(() => { window.ready = document.fonts.check('600 32px Kanit') ? 'kanit' : 'fallback'; redraw(); });
</script>
</body>
</html>
